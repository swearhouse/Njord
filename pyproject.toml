[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "njord"
version = "0.1.0"
description = "Njord, a small self-hosted monthly budget and loan tracker"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
njord = ["static/*", "templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
