<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Njord</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='njord.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='njord.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <strong class="brand"><img src="{{ url_for('static', filename='njord.png') }}" alt="" width="28" height="28">Njord</strong>
    {% if session.user %}
    <nav>
      <a href="{{ url_for('overview') }}">Overview</a>
      <a href="{{ url_for('items') }}">Edit items</a>
      <a href="{{ url_for('loans') }}">Loans</a>
      <a href="{{ url_for('options') }}">Options</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}"><button class="link">Log out ({{ session.user }})</button></form>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
