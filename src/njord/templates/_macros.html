{% macro fields(i) %}
  <input name="name" placeholder="Name" aria-label="Name" value="{{ i.name if i else '' }}" required>
  <select name="type" aria-label="Type">
    <option value="income" {{ 'selected' if i and i.type == 'income' }}>Income</option>
    <option value="expense" {{ 'selected' if not i or i.type == 'expense' }}>Expense</option>
  </select>
  <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" aria-label="Amount per payment" value="{{ i.amount if i else '' }}" required>
  <select name="every" aria-label="Frequency">
    {% for months, label in frequencies %}<option value="{{ months }}" {{ 'selected' if (i.every if i and i.every else 1) == months }}>{{ label }}</option>{% endfor %}
  </select>
  <input name="start" type="month" aria-label="A month it was paid" title="A month it was paid (past or upcoming). Used to find the next payment dates." value="{{ i.start if i and i.start else '' }}">
  <select name="category" aria-label="Category">
    <option value="">No category</option>
    {% for group, names in categories.items() %}
    <optgroup label="{{ group }}">
      {% for name in names %}<option value="{{ name }}" {{ 'selected' if i and i.category == name }}>{{ name }}</option>{% endfor %}
    </optgroup>
    {% endfor %}
  </select>
  <select name="asset_id" aria-label="Asset">
    <option value="">No asset</option>
    {% for a in assets %}<option value="{{ a.id }}" {{ 'selected' if i and i.asset_id == a.id }}>{{ a.name }}</option>{% endfor %}
  </select>
{% endmacro %}

{% macro row(i) %}
<form method="post" action="{{ url_for('update_item', item_id=i.id) }}" class="item-row autosave" data-delete-url="{{ url_for('delete_item', item_id=i.id) }}">
  {{ fields(i) }}
  <span class="status"></span>
  <button type="button" class="icon danger delete" title="Delete" aria-label="Delete">&#10005;</button>
</form>
{% endmacro %}
